services:
  - type: web
    name: memori-ai-gateway
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MODEL_BASE_URL
        value: https://api.openai.com/v1
      - key: MODEL_NAME
        sync: false
      - key: MODEL_API_KEY
        sync: false
